<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2140">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="抓抓樂">
<title>抓抓樂夾娃娃機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D stage; HUD pinned top, arcade stick + button pinned bottom. Single deliberate night-arcade look. */
:root{
  --room:#1b2140;
  --room-2:#2e3874;
  --panel:rgba(20,23,48,.74);
  --cream:#fff4e0;
  --cream-dim:rgba(255,244,224,.66);
  --tangerine:#ff7a3d;
  --tangerine-deep:#c94c17;
  --mint:#5fd6c0;
  --gold:#ffd66b;
  --ink:#151832;
  --display:"Bungee","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;overflow:hidden;overscroll-behavior:none;background:radial-gradient(ellipse 80% 70% at 50% 38%,var(--room-2),var(--room) 72%);color:var(--cream);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}

.hud{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{margin:0;font-weight:900;font-size:22px;letter-spacing:.04em;line-height:1;text-shadow:0 2px 0 var(--tangerine-deep)}
.brand h1 span{font-family:var(--display);font-size:13px;color:var(--mint);margin-left:6px;letter-spacing:.06em;text-shadow:none}
.tray{display:flex;flex-wrap:wrap;gap:6px;max-width:min(60vw,320px)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);padding:4px 9px 4px 6px;border-radius:999px;font-size:12px;font-weight:700}
.chip i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.stats{display:flex;gap:6px}
.stat{background:var(--panel);border-radius:12px;padding:6px 10px 7px;min-width:52px;text-align:center}
.stat label{display:block;font-size:10px;letter-spacing:.14em;color:var(--cream-dim);font-weight:700}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.timer b{color:var(--mint)}
.stat.timer.low b{color:var(--tangerine)}
.stat.guard b{font-size:16px;line-height:1.375}
.stat.guard.on{background:linear-gradient(135deg,#ffcf4a,var(--tangerine));animation:guardGlow 1s ease-in-out infinite}
.stat.guard.on label{color:var(--ink)}
.stat.guard.on b{color:var(--ink)}
@keyframes guardGlow{50%{box-shadow:0 0 0 4px rgba(255,207,74,.35),0 0 22px rgba(255,160,60,.8)}}
@media (prefers-reduced-motion:reduce){.stat.guard.on{animation:none}}
@media (max-width:420px){
  .hud{flex-wrap:nowrap}
  .stats{gap:4px;flex:none}
  .stat{min-width:0;width:44px;padding:5px 2px 6px;border-radius:10px}
  .stat label{font-size:9px;letter-spacing:.04em}
  .stat b{font-size:16px}
  .stat.guard b{font-size:13px;line-height:1.35}
}

.tools{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tools button{font:700 12px/1 var(--body);color:var(--cream);background:var(--panel);border:1px solid rgba(255,244,224,.18);border-radius:999px;padding:7px 12px;cursor:pointer}
.tools button:hover{border-color:var(--mint)}
.tools button[aria-pressed="true"]{background:var(--mint);color:var(--ink);border-color:var(--mint)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.easy-wrap{position:relative;margin-top:4px}
.tools .easy{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 13px 8px 10px;border:2px solid var(--gold)}
.easy .dot{width:14px;height:14px;border-radius:50%;border:2px solid #ff3b5c;box-sizing:border-box;position:relative;flex:none}
.easy .dot::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#ff3b5c}
.tools .easy[aria-pressed="true"]{background:var(--mint);border-color:var(--mint)}
.tools .easy.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,214,107,.7)}50%{transform:scale(1.08);box-shadow:0 0 0 8px rgba(255,214,107,0),0 0 18px rgba(255,214,107,.9)}}
.easy-tip{position:absolute;right:0;top:calc(100% + 12px);width:214px;background:var(--cream);color:var(--ink);border-radius:14px;padding:11px 12px 12px;font-size:13px;line-height:1.45;box-shadow:0 10px 26px rgba(0,0,0,.4);z-index:3;animation:rise .3s ease-out}
.easy-tip::before{content:"";position:absolute;right:28px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--cream)}
.easy-tip b{display:block;font-size:14px;font-weight:900;margin-bottom:2px}
.easy-tip .acts{display:flex;gap:6px;margin-top:9px}
.easy-tip .acts button{flex:1;font:700 13px/1 var(--body);border:0;border-radius:999px;padding:9px 0;cursor:pointer}
.easy-tip .yes{background:var(--tangerine);color:var(--cream);box-shadow:0 3px 0 var(--tangerine-deep)}
.easy-tip .no{background:rgba(21,24,50,.1);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.tools .easy.nudge{animation:none;box-shadow:0 0 0 4px rgba(255,214,107,.6)}}

.ach-banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;padding:16px}
.ach-card{position:relative;text-align:center;background:linear-gradient(160deg,#2e3874,var(--ink));border:3px solid var(--gold);border-radius:24px;padding:20px 28px 22px;min-width:min(280px,100%);box-shadow:0 0 0 6px rgba(255,214,107,.2),0 0 60px rgba(255,190,60,.55),0 20px 50px rgba(0,0,0,.5);animation:achIn 3.4s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes achIn{0%{transform:scale(.4) translateY(40px);opacity:0}10%{transform:scale(1);opacity:1}86%{transform:scale(1);opacity:1}100%{transform:scale(.9) translateY(-20px);opacity:0}}
.ach-card small{display:block;font:400 11px/1 var(--display);letter-spacing:.24em;color:var(--gold)}
.ach-card .medal{margin:12px auto 10px;width:92px;height:92px}
.ach-card h2{margin:0;font-size:15px;font-weight:700;color:var(--cream-dim)}
.ach-card strong{display:block;font-size:30px;font-weight:900;margin-top:2px;text-shadow:0 3px 0 var(--tangerine-deep)}
.ach-card p{margin:6px 0 0;font-size:13px;color:var(--cream-dim)}
.medal{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff4e0,#f6d9a8);border:4px solid var(--gold);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 3px 0 #b8860b;display:grid;place-items:center;overflow:hidden;box-sizing:border-box}
.medal img{width:92%;height:92%;object-fit:contain}
.medal .star{font-size:34px;line-height:1;color:#e0a100;text-shadow:0 2px 0 #fff}
.ach-card .medal .star{font-size:50px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ach{background:rgba(255,244,224,.06);border-radius:14px;padding:10px 6px;text-align:center}
.ach .medal{margin:0 auto 6px}
.ach b{display:block;font-size:12px}
.ach span{display:block;font-size:11px;color:var(--cream-dim);margin-top:2px}
.ach.locked .medal{filter:grayscale(1) brightness(.45);border-color:rgba(255,244,224,.25);box-shadow:none}
.ach.locked b{color:var(--cream-dim)}
.sheet-body.clear{text-align:center;padding:22px 18px 20px}
.clear small{display:block;font:400 11px/1 var(--display);letter-spacing:.24em;color:var(--gold)}
.clear h2{margin:10px 0 14px;font-size:30px;font-weight:900;text-shadow:0 3px 0 var(--tangerine-deep)}
.cstats{display:flex;gap:8px;justify-content:center}
.cstats div{flex:1;background:rgba(255,244,224,.07);border-radius:14px;padding:10px 4px}
.cstats b{display:block;font:400 26px/1.1 var(--display);color:var(--mint)}
.cstats span{font-size:12px;color:var(--cream-dim)}
.clear p{margin:12px 0 0;font-size:14px;font-weight:700}
.clear p.dim{font-size:12px;color:var(--cream-dim);font-weight:500}
.pill.big{margin-top:16px;padding:14px 28px;font-size:16px;background:var(--tangerine);color:var(--cream);box-shadow:0 4px 0 var(--tangerine-deep)}
.cat h3 em{font-style:normal;color:var(--cream-dim);margin-left:6px;letter-spacing:.04em}
.cat h3 .done{color:var(--gold)}

.toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);background:var(--tangerine);color:var(--cream);font-weight:900;font-size:clamp(18px,5vw,26px);padding:10px 22px;border-radius:999px;box-shadow:0 6px 0 var(--tangerine-deep),0 14px 30px rgba(0,0,0,.35);white-space:nowrap;pointer-events:none;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.toast.soft{background:var(--panel);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.guard-vignette{position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 60px 12px rgba(255,190,60,.5),inset 0 0 0 4px var(--gold);animation:vig 1.1s ease-in-out infinite}
@keyframes vig{50%{box-shadow:inset 0 0 120px 30px rgba(255,110,60,.55),inset 0 0 0 7px #fff1b0}}
.guard-banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;overflow:hidden}
.guard-banner .rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:50%;background:repeating-conic-gradient(rgba(255,214,107,.3) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%);animation:spin 7s linear infinite,fadeRays 2.8s ease-out forwards}
.gb-text{position:relative;text-align:center;font-weight:900;font-size:clamp(46px,13vw,104px);line-height:1;color:var(--cream);text-shadow:0 6px 0 var(--tangerine-deep),0 0 34px rgba(255,200,80,.95),0 0 80px rgba(255,120,60,.7);animation:slam 2.8s cubic-bezier(.2,1.5,.4,1) forwards}
.gb-text small{display:block;font:400 .2em/1 var(--display);letter-spacing:.24em;color:var(--gold);margin-bottom:.3em;text-shadow:0 2px 0 var(--ink)}
.gb-text span{display:block;font-size:.26em;margin-top:.4em;color:var(--cream);text-shadow:0 2px 0 var(--ink),0 0 18px rgba(255,160,60,.9)}
@keyframes slam{0%{transform:scale(2.6) rotate(-6deg);opacity:0}12%{transform:scale(1) rotate(0);opacity:1}20%{transform:scale(1.08)}28%{transform:scale(1)}82%{transform:scale(1);opacity:1}100%{transform:scale(.85);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeRays{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.guard-vignette{animation:none}.guard-banner .rays{animation:fadeRays 2.8s ease-out forwards}}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.controls{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.hint{flex:1;min-width:0;text-align:center;margin:0 0 10px;font-size:13px;font-weight:700;color:var(--cream-dim);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.hint kbd{font-family:var(--display);font-size:11px;background:var(--panel);border-radius:5px;padding:2px 5px;color:var(--cream)}
.keys{display:block;margin-top:4px;font-weight:500;font-size:12px}
@media (hover:none){.keys{display:none}}

.stick{pointer-events:auto;position:relative;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#2a3160,var(--ink) 70%);border:3px solid rgba(255,244,224,.22);box-shadow:inset 0 6px 16px rgba(0,0,0,.55),0 8px 20px rgba(0,0,0,.35);touch-action:none;flex:none}
.stick::after{content:"";position:absolute;inset:26px;border-radius:50%;border:2px dashed rgba(255,244,224,.12)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#ffd2b8 0 12%,var(--tangerine) 38%,var(--tangerine-deep) 100%);box-shadow:0 6px 10px rgba(0,0,0,.45);z-index:1;will-change:transform}

.grab{pointer-events:auto;flex:none;width:112px;height:112px;border-radius:50%;border:4px solid rgba(255,244,224,.85);background:radial-gradient(circle at 40% 32%,#ffb58f 0 10%,var(--tangerine) 45%,#f0621f 100%);color:var(--cream);font:900 28px/1 var(--body);letter-spacing:.05em;text-shadow:0 2px 0 var(--tangerine-deep);box-shadow:0 9px 0 var(--tangerine-deep),0 16px 26px rgba(0,0,0,.4);cursor:pointer;touch-action:none;transition:transform .06s,box-shadow .06s,filter .2s}
.grab{display:grid;place-items:center;padding:0}
.grab span{display:block;line-height:1;text-align:center}
.grab.big{font-size:56px;letter-spacing:0}
.grab.down{transform:translateY(7px);box-shadow:0 2px 0 var(--tangerine-deep),0 6px 12px rgba(0,0,0,.4)}
.grab.busy{filter:saturate(.35) brightness(.8)}
.grab.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 9px 0 var(--tangerine-deep),0 0 0 10px rgba(255,122,61,.25),0 16px 26px rgba(0,0,0,.4)}}

.bag{pointer-events:auto;position:relative;width:62px;height:62px;padding:4px;border:0;border-radius:18px;background:var(--panel);cursor:pointer;transition:transform .15s}
.bag svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.bag:hover{transform:translateY(-2px)}
.bag-count{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--tangerine);color:var(--cream);font:400 12px/22px var(--display);text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--tangerine-deep)}
.bag.bump{animation:bump .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.95) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.bag.bump{animation:none}}
.backdrop{position:absolute;inset:0;background:rgba(10,12,28,.55);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5}
.sheet{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--ink);border:1px solid rgba(255,244,224,.14);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;animation:rise .25s ease-out}
.sheet.small{width:min(380px,100%)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px solid rgba(255,244,224,.1)}
.sheet-head h2{margin:0;font-size:18px;font-weight:900;letter-spacing:.04em}
.sheet-head p{margin:3px 0 0;font-size:12px;color:var(--cream-dim);font-variant-numeric:tabular-nums}
.close{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,244,224,.1);color:var(--cream);font:700 18px/1 var(--body);cursor:pointer}
.sheet-body{padding:14px 18px 18px;overflow-y:auto;min-height:0}
.cat{display:flex;flex-direction:column;gap:14px}
.cat h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;color:var(--mint);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.card{background:rgba(255,244,224,.06);border-radius:14px;padding:8px 6px 9px;text-align:center;position:relative;border:0;color:inherit;font:inherit;width:100%}
button.card{cursor:pointer;transition:transform .15s,background .15s}
button.card:hover{transform:translateY(-3px);background:rgba(255,244,224,.12)}
.backdrop.viewer{z-index:6;background:rgba(10,12,28,.72)}
.viewer-stage{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 38%,var(--room-2),var(--ink) 75%)}
.viewer-stage canvas{display:block;margin:0 auto;width:min(100%,calc(100vh - 240px));min-width:200px;aspect-ratio:1;max-width:100%;touch-action:none;cursor:grab}
.viewer-stage canvas:active{cursor:grabbing}
.viewer-tip{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:12px;font-weight:700;color:var(--cream-dim);pointer-events:none}
.viewer-actions{display:flex;justify-content:center;gap:8px;margin-top:12px}
.viewer-actions button{font:700 13px/1 var(--body);color:var(--cream);background:rgba(255,244,224,.1);border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.viewer-actions button[aria-pressed="true"]{background:var(--mint);color:var(--ink)}
.card img{width:100%;max-width:96px;aspect-ratio:1;display:block;margin:0 auto}
.card.locked img{filter:brightness(0) opacity(.35)}
.card .nm{display:block;font-size:12px;font-weight:700;margin-top:2px}
.card.locked .nm{color:var(--cream-dim)}
.card .ct{position:absolute;top:6px;right:6px;font-family:var(--display);font-size:11px;background:var(--tangerine);color:var(--cream);border-radius:999px;padding:2px 7px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,244,224,.08)}
.row:last-child{border-bottom:0}
.row label{font-weight:700;font-size:15px}
.row small{display:block;font-weight:500;font-size:12px;color:var(--cream-dim);margin-top:2px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:999px;background:rgba(255,244,224,.18);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--cream);transition:transform .2s}
.switch:checked{background:var(--mint)}
.switch:checked::after{transform:translateX(20px)}
.switch:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.pill{font:700 13px/1 var(--body);color:var(--ink);background:var(--mint);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.boot{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--cream-dim)}
@media (max-width:420px){
  .stick{width:112px;height:112px}
  .knob{width:52px;height:52px;margin:-26px 0 0 -26px}
  .grab{width:100px;height:100px;font-size:25px}
  .grab.big{font-size:50px}
  .hint{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.toast,.grab.pulse{animation:none}}
</style>

<div id="app">
  <canvas id="c" aria-label="3D 夾娃娃機畫面，拖曳可旋轉視角"></canvas>
  <div class="boot" id="boot">機台準備中…</div>

  <header class="hud">
    <div class="brand">
      <h1>抓抓樂<span>CLAW</span></h1>
      <button class="bag" id="bagBtn" type="button" aria-label="打開背包，查看收集品">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M23 15q9-10 18 0" fill="none" stroke="#4e311c" stroke-width="4.5" stroke-linecap="round"/>
          <rect x="7" y="27" width="7" height="22" rx="3.5" fill="#6f4526"/>
          <rect x="50" y="27" width="7" height="22" rx="3.5" fill="#6f4526"/>
          <rect x="11" y="14" width="42" height="45" rx="13" fill="#8b5a33"/>
          <path d="M11 28q0-14 14-14h14q14 0 14 14v5q-21 7-42 0z" fill="#a86d3f"/>
          <path d="M15 24q2-6 9-7" fill="none" stroke="#c48a5a" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="18" y="39" width="28" height="15" rx="5" fill="#6f4526"/>
          <path d="M21 44h22" stroke="#4e311c" stroke-width="1.6" stroke-dasharray="2.5 2"/>
          <rect x="28.5" y="29" width="7" height="9" rx="2" fill="#f2c14e"/>
          <rect x="30.5" y="31.5" width="3" height="4" rx="1" fill="#8b5a33"/>
        </svg>
        <span class="bag-count" id="bagCount">0</span>
      </button>
    </div>
    <div class="stats">

(function(){

function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t; }
function checker(rx,ry){ const t=canvasTex(64,64,(x)=>{ x.fillStyle='#fff4e0'; x.fillRect(0,0,64,64); x.fillStyle='#f6bfd0'; x.fillRect(0,0,32,32); x.fillRect(32,32,32,32); }); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.magFilter=THREE.NearestFilter; return t; }
const dotsTex = canvasTex(128,128,(x)=>{ x.fillStyle='#5fd6c0'; x.fillRect(0,0,128,128); x.fillStyle='rgba(255,244,224,.55)'; [[32,32],[96,96]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,11,0,7);x.fill();}); });
dotsTex.wrapS=dotsTex.wrapT=THREE.RepeatWrapping; dotsTex.repeat.set(6,7.5);

function box(w,h,d,mat,x,y,z,shadow=true){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=shadow; m.receiveShadow=true; scene.add(m); return m; }

/* ================= physics world ================= */
const world = new CANNON.World();
world.gravity.set(0,-9.82,0);
world.allowSleep = true;
world.solver.iterations = 14;
world.defaultContactMaterial.friction = 0.5;
world.defaultContactMaterial.restitution = 0.06;

const staticMat=new CANNON.Material('static'), plushMat=new CANNON.Material('plush'), eggMat=new CANNON.Material('egg'), clawMat=new CANNON.Material('claw');
[[eggMat,staticMat,.22],[eggMat,plushMat,.3],[eggMat,eggMat,.18],[eggMat,clawMat,.25],[plushMat,clawMat,.75]].forEach(([a,b,f])=>{
  world.addContactMaterial(new CANNON.ContactMaterial(a,b,{friction:f,restitution:.08}));
});
const removeBody = b => (world.removeBody ? world.removeBody(b) : world.remove(b));

function addStatic(hx,hy,hz,x,y,z){
  const b=new CANNON.Body({mass:0, material:staticMat});
  b.addShape(new CANNON.Box(new CANNON.Vec3(hx,hy,hz)));
  b.position.set(x,y,z);
  b.collisionFilterGroup=G_STATIC; b.collisionFilterMask=G_PRIZE;
  world.addBody(b); return b;
}

/* ================= machine ================= */
// interior: x[-0.8,0.8] z[-0.6,0.6], floor y=0; chute hole front-left x[-0.8,-0.38] z[0.13,0.6]

addStatic(0.15,1.6,0.8, -0.925,0.7,0); addStatic(0.15,1.6,0.8, 0.925,0.7,0);
addStatic(1.0,1.6,0.15, 0,0.7,-0.725); addStatic(1.0,1.6,0.15, 0,0.7,0.725);

addStatic(0.012,0.11,0.235, -0.37,0.11,0.365);       // chute barrier (acrylic)
addStatic(0.22,0.11,0.012, -0.59,0.11,0.12);
// shaft below the hole flares out under the floor so a big prize lying crosswise can't wedge in it
addStatic(0.01,0.35,0.34, -0.22,-0.45,0.28);         // shaft walls (top at y=-0.1, hidden under the floor)
addStatic(0.34,0.35,0.01, -0.5,-0.45,-0.07);
addStatic(0.4,0.05,0.4, -0.5,-0.85,0.25);            // shaft bottom

(function buildCabinet(){

  const shaft=new THREE.Mesh(new THREE.BoxGeometry(0.412,0.8,0.462),MAT.hole); shaft.position.set(-0.59,-0.402,0.365); scene.add(shaft);
  // base cabinet (split around the shaft so it stays dark inside)
  box(1.28,0.86,1.3,MAT.mint,0.26,-0.53,0);
  box(0.52,0.86,0.77,MAT.mint,-0.64,-0.53,-0.265);
  box(0.1,0.86,0.53,MAT.mint,-0.85,-0.53,0.385);
  box(0.42,0.86,0.05,MAT.mint,-0.59,-0.53,0.625);
  box(1.82,0.06,0.04,MAT.cream,0,-0.035,0.645,false);
  box(1.84,0.08,1.34,MAT.ink,0,-1.0,0);
  // chute door + coin panel on the front
  box(0.42,0.34,0.02,MAT.tangerine,-0.59,-0.5,0.655,false);
  box(0.34,0.26,0.02,MAT.ink,-0.59,-0.5,0.663,false);

  // glass

  [-0.8,0.8].forEach(x=>{ const g=new THREE.Mesh(new THREE.PlaneGeometry(1.2,2.0),MAT.glass); g.rotation.y=Math.PI/2; g.position.set(x,1.0,0); scene.add(g); });
  // acrylic barrier around chute
  const a1=new THREE.Mesh(new THREE.BoxGeometry(0.024,0.22,0.47),MAT.acrylic); a1.position.set(-0.37,0.11,0.365); scene.add(a1);
  const a2=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.22,0.024),MAT.acrylic); a2.position.set(-0.59,0.11,0.12); scene.add(a2);
  box(0.03,0.02,0.49,MAT.tangerine,-0.37,0.225,0.365,false); box(0.45,0.02,0.03,MAT.tangerine,-0.59,0.225,0.12,false);
  // posts and frame
  [[-0.84,-0.62],[0.84,-0.62],[-0.84,0.62],[0.84,0.62]].forEach(([x,z])=>box(0.08,2.06,0.08,MAT.post,x,1.0,z));
  box(1.76,0.05,0.06,MAT.cream,0,0.02,0.62,false);

  box(1.84,0.42,1.34,MAT.tangerine,0,2.2,0);
  box(1.86,0.05,1.36,MAT.cream,0,2.0,0,false);
  box(1.86,0.04,1.36,MAT.cream,0,2.42,0,false);

// marquee sign
const signTex = canvasTex(1024,256,()=>{});

/* ================= prizes ================= */
const geoCache={}, matCache={};
const sphGeo = r => geoCache[r]||(geoCache[r]=new THREE.SphereGeometry(r,22,16));
const plush = hex => matCache[hex]||(matCache[hex]=std(hex,.93));
function part(geo,mat,x=0,y=0,z=0,sx=1,sy=1,sz=1){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); m.castShadow=true; m.receiveShadow=true; return m; }
const DARK=0x2a1f1f, CREAMY=0xfff1dc, PINK=0xf7a8c0;

function makeBear(c){
  const g=new THREE.Group(), m=plush(c), cr=plush(CREAMY), bk=plush(DARK);
  g.add(part(sphGeo(.105),m,0,0,0,1,1.05,.95));
  g.add(part(sphGeo(.07),cr,0,-.01,.052,1,1,.6));
  g.add(part(sphGeo(.085),m,0,.16,0));
  [-1,1].forEach(s=>{
    g.add(part(sphGeo(.032),m,s*.062,.228,-.005,1,1,.7));
    g.add(part(sphGeo(.018),cr,s*.062,.228,.012,1,1,.4));
    g.add(part(sphGeo(.011),bk,s*.032,.18,.074));
    g.add(part(sphGeo(.038),m,s*.095,.03,.03,.9,1.2,.9));
    g.add(part(sphGeo(.042),m,s*.055,-.085,.045,1,.9,1.1));
  });
  g.add(part(sphGeo(.036),cr,0,.14,.068,1.1,.85,.8));
  g.add(part(sphGeo(.011),bk,0,.152,.1));
  // body, head, ears, arms, feet all get collision so nothing pokes through the glass
  return {g, spheres:[[0,0,0,.105],[0,.16,0,.085],[-.062,.228,-.005,.03],[.062,.228,-.005,.03],[-.095,.03,.03,.04],[.095,.03,.03,.04],[-.055,-.085,.045,.042],[.055,-.085,.045,.042]], mass:.26, grip:1};
}
function makeBunny(c){
  const g=new THREE.Group(), m=plush(c), pk=plush(PINK), bk=plush(DARK), w=plush(0xffffff);
  g.add(part(sphGeo(.1),m,0,0,0,1,1.02,.95));
  g.add(part(sphGeo(.08),m,0,.145,0));
  [-1,1].forEach(s=>{
    const e=part(sphGeo(.028),m,s*.032,.25,-.01,1,3,.7); e.rotation.z=-s*.18; g.add(e);
    const ei=part(sphGeo(.016),pk,s*.034,.25,.006,1,3.4,.35); ei.rotation.z=-s*.18; g.add(ei);

function driveKin(k,pos,quat){
  const b=k.body;
  b.position.set(k.pp.x,k.pp.y,k.pp.z);
  b.quaternion.set(k.pq.x,k.pq.y,k.pq.z,k.pq.w);
  b.velocity.set((pos.x-k.pp.x)/H,(pos.y-k.pp.y)/H,(pos.z-k.pp.z)/H);
  _dq.copy(quat).multiply(_qi.copy(k.pq).invert());
  if(_dq.w<0){_dq.x=-_dq.x;_dq.y=-_dq.y;_dq.z=-_dq.z;_dq.w=-_dq.w;}
  const s=Math.sqrt(Math.max(0,1-_dq.w*_dq.w));
  if(s<1e-6) b.angularVelocity.set(0,0,0);
  else { const w=2*Math.acos(Math.min(1,_dq.w))/H/s; b.angularVelocity.set(_dq.x*w,_dq.y*w,_dq.z*w); }
  k.pp.copy(pos); k.pq.copy(quat);
}
function snapKin(){ hubKin.pp.copy(S.hubP); hubKin.pq.copy(S.hubQ); prongKin.forEach((k,i)=>{k.pp.copy(S.pP[i]); k.pq.copy(S.pQ[i]);}); driveAll(); }
const _hp=new THREE.Vector3(), _hq=new THREE.Quaternion();
function driveAll(){
  driveKin(hubKin,S.hubP,S.hubQ); prongKin.forEach((k,i)=>driveKin(k,S.pP[i],S.pQ[i]));
  const g=S.grab;
  if(g){ // held prize rides rigidly with the claw head
    _hp.copy(g.rel).applyQuaternion(S.hubQ).add(S.hubP);
    _hq.copy(S.hubQ).multiply(g.relQ);
    driveKin(g.kin,_hp,_hq);
  }
}

function setPhase(p){ S.phase=p; S.pt=0; updateButton(); }
function wakeNear(){ for(const p of prizes){ const b=p.body; if(Math.hypot(b.position.x-S.hubP.x,b.position.z-S.hubP.z)<0.45) b.wakeUp(); } }

/* ----- input ----- */
const stickV={x:0,y:0}, keys={};
function moveVector(){
  let sx=stickV.x+((keys.right?1:0)-(keys.left?1:0)), sy=stickV.y+((keys.up?1:0)-(keys.down?1:0));
  const m=Math.hypot(sx,sy); if(m>1){sx/=m; sy/=m;}
  const fx=-Math.sin(cam.az), fz=-Math.cos(cam.az), rx=-fz, rz=fx;
  return {x:rx*sx+fx*sy, z:rz*sx+fz*sy};
}

/* ----- game step (before physics) ----- */
function stepGame(h){
  S.pt+=h;
  const P=S.phase;
  let tvx=0,tvz=0;
  if(P==='move'){
    S.timeLeft-=h;
    const m=moveVector(); tvx=m.x*MOVE_SPEED; tvz=m.z*MOVE_SPEED;
    if(S.timeLeft<=0){ S.timeLeft=0; startDrop(); }
  } else if(P==='carry'){
    // aim the *prize* (not the claw) at the middle of the chute, since it may hang off to one side
    const tg=carryTarget(), dx=tg.x-S.gx, dz=tg.z-S.gz, d=Math.hypot(dx,dz);
    if(d>0.004){ const sp=Math.min(CARRY_SPEED,d*3); tvx=dx/d*sp; tvz=dz/d*sp; }
    else {
      S.settle=(S.settle||0)+h;
      // only open once the swing has died down, so the prize drops straight in instead of being flung
      const calm=Math.hypot(S.ox,S.oz)<0.012 && Math.hypot(S.ovx,S.ovz)<0.06;
      if(Math.hypot(S.gvx,S.gvz)<0.03 && S.pt>0.2 && (calm || S.settle>2.5)){ S.settle=0; beginRelease(); }
    }
    const g=S.grab;
    if(g && g.prize.body.collisionFilterMask===G_STATIC && !overlapsOthers(g.prize)) g.prize.body.collisionFilterMask=G_STATIC|G_PRIZE;
    if(g && g.fate && g.fate.stage==='carry' && 1-d/S.carryD0>=g.fate.at) dropGrab(true);
  }
  // gantry with limited acceleration; the claw hangs as a pendulum and reacts to it
  let ax=(tvx-S.gvx)/h, az=(tvz-S.gvz)/h;
  const am=Math.hypot(ax,az); if(am>MAX_ACC){ ax*=MAX_ACC/am; az*=MAX_ACC/am; }
  S.gvx+=ax*h; S.gvz+=az*h;
  let nx=S.gx+S.gvx*h, nz=S.gz+S.gvz*h;
  if(nx<-BX||nx>BX){ nx=clamp(nx,-BX,BX); S.gvx=0; }
  if(nz<-BZ||nz>BZ){ nz=clamp(nz,-BZ,BZ); S.gvz=0; }
  S.gx=nx; S.gz=nz;

  switch(P){
    case 'coin':
      if(S.pt>=COIN_T+0.25){ S.timeLeft=PLAY_TIME; setPhase('move'); tone(988,.08,'square',.04); tone(1319,.22,'square',.04,.08); }
      // falls through to keep the prongs relaxed
    case 'ready': case 'move':
      for(let i=0;i<3;i++) S.theta[i]=approach(S.theta[i],RELAX,0.8*h); break;
    case 'opening':
      for(let i=0;i<3;i++) S.theta[i]=approach(S.theta[i],OPEN,1.6*h);
      if(S.pt>0.35) setPhase('descend'); break;
    case 'descend':
      S.hy-=0.6*h; wakeNear();
      if(S.hy<=MIN_HY || S.pt>4){ S.hy=Math.max(S.hy,MIN_HY); beginClose(); } break;
    case 'settle':
      if(S.pt>0.18) setPhase('close'); break;
    case 'close': {
      wakeNear();
      let all=true;
      for(let i=0;i<3;i++){ if(S.stopped[i]) continue; all=false; S.theta[i]-=0.95*h; if(S.theta[i]<=CLOSED){S.theta[i]=CLOSED; S.stopped[i]=true;} }
      if(all || S.pt>1.2){ setPhase('hold'); }
      break; }
    case 'hold':
      // let the squeezed pile relax inside the closed prongs first, then decide what the claw is holding
      if(S.pt>0.35){ wakeNear(); evaluateGrab(); S.liftStart=S.hy; setPhase('lift'); tone(330,.5,'triangle',.03,0,660); } break;
    case 'lift': {
      S.hy=Math.min(TOP_Y,S.hy+0.5*h);
      const g=S.grab;
      if(g && g.prize.body.collisionFilterMask===G_STATIC && S.hy-S.liftStart>0.2 && !overlapsOthers(g.prize))
        g.prize.body.collisionFilterMask=G_STATIC|G_PRIZE;
      if(g && g.fate && g.fate.stage==='lift' && (S.hy-S.liftStart)/Math.max(.01,TOP_Y-S.liftStart)>=g.fate.at) dropGrab(true);
      if(S.hy>=TOP_Y && S.pt>0.3){ const tg=carryTarget(); S.carryD0=Math.max(0.02,Math.hypot(tg.x-S.gx,tg.z-S.gz)); S.settle=0; setPhase('carry'); }
      break; }
    case 'release':
      for(let i=0;i<3;i++) S.theta[i]=approach(S.theta[i],OPEN,2.2*h);
      if(S.pt>0.15 && S.grab) releaseGrab();
      if(S.pt>1.4){ endTurn(); }
      break;
  }
  if(S.loosen>0){ S.loosen-=h; for(let i=0;i<3;i++) S.theta[i]=Math.min(OPEN,S.theta[i]+0.5*h); }

  // pendulum (small-angle), driven by gantry acceleration
  const L=Math.max(0.15,GANTRY_Y-S.hy), w2=9.82/L;
  const damp=(P==='settle'||P==='close'||P==='hold')?7:(P==='carry'&&S.settle>0)?4:2*0.05*Math.sqrt(w2);
  S.ovx+=(-w2*S.ox-damp*S.ovx-ax)*h; S.ovz+=(-w2*S.oz-damp*S.ovz-az)*h;
  S.ox+=S.ovx*h; S.oz+=S.ovz*h;
  const lim=0.3*L; S.ox=clamp(S.ox,-lim,lim); S.oz=clamp(S.oz,-lim,lim);
  if(S.grab){ // a carried prize bumps the glass: stop the swing there instead of pushing through
    // limits depend on which side the prize hangs, so a prize on the far side doesn't hold the claw back
    const b=S.grab.prize.body.position, e=S.grab.ext, ofx=b.x-S.hubP.x, ofz=b.z-S.hubP.z;
    const lim2=(v,lo,hi)=>lo>hi?(lo+hi)/2:clamp(v,lo,hi);
    const hx=S.gx+S.ox, hz=S.gz+S.oz;
    const step=0.6*h;   // ease back in rather than snapping, so the held prize isn't yanked
    const ex=hx-lim2(hx,-0.775-ofx+e,0.775-ofx-e), ez=hz-lim2(hz,-0.575-ofz+e,0.575-ofz-e);
    if(ex){ S.ox-=clamp(ex,-step,step); if(S.ovx*ex>0) S.ovx*=-0.2; }
    if(ez){ S.oz-=clamp(ez,-step,step); if(S.ovz*ez>0) S.ovz*=-0.2; }
  }
  computePoses();
}

function beginClose(){ S.stopped=[false,false,false]; S.contactOf=[null,null,null]; setPhase('settle'); tone(160,.12,'square',.03); }

/* ----- checks (after physics) ----- */
function descendBlocked(){
  const hb=_v2.set(S.hubP.x,S.hubP.y-0.05,S.hubP.z);
  const tips=[0,1,2].map(i=>samplePoint(i,4,new THREE.Vector3()));
  if(tips.some(t=>t.y<=0.012)) return true;
  for(const p of prizes){
    if(S.grab && S.grab.prize===p) continue;
    for(const s of spheresOf(p)){
      if(Math.hypot(hb.x-s.x,hb.y-s.y,hb.z-s.z)<s.r+0.012) return true;
      for(const t of tips){ if(t.y>s.y && Math.hypot(t.x-s.x,t.y-s.y,t.z-s.z)<s.r-0.022) return true; }
    }
  }
  return false;
}
function closeContacts(){
  const ax=S.hubP.x, az=S.hubP.z;
  const sph=prizes.map(p=>({p,s:spheresOf(p)}));
  for(let i=0;i<3;i++){
    if(S.stopped[i]) continue;
    outer: for(let k=1;k<5;k++){
      const pt=samplePoint(i,k,_v);
      const pr=Math.hypot(pt.x-ax,pt.z-az);
      for(const {p,s} of sph){
        for(const c of s){
          if(Math.hypot(pt.x-c.x,pt.y-c.y,pt.z-c.z)<c.r+0.02 && Math.hypot(c.x-ax,c.z-az)<pr+0.005){
            S.stopped[i]=true; S.contactOf[i]=p; break outer;
          }
        }
      }
    }
  }
}
function evaluateGrab(){
  const ax=S.hubP.x, az=S.hubP.z;
  const counts=new Map();
  S.contactOf.forEach(p=>{ if(p) counts.set(p,(counts.get(p)||0)+1); });
  let best=null, bc=0;
  counts.forEach((c,p)=>{ if(c>bc){bc=c;best=p;} });
  let tipY=0; for(let i=0;i<3;i++) tipY+=samplePoint(i,4,_v).y/3;
  let enclosed=false;
  if(bc<2){
    for(const p of prizes){
      const b=p.body.position;
      if(Math.hypot(b.x-ax,b.z-az)<0.06 && b.y>tipY-0.02 && b.y<S.hubP.y){ best=p; bc=3; enclosed=true; break; }
    }
  }
  const guard=guaranteed();
  if(guard && (!best || bc<2)){
    // 保夾: full claw power, take the nearest prize anywhere inside the claw's reach
    let bd=0.17;
    for(const p of prizes){
      const pb=p.body.position, dd=Math.hypot(pb.x-ax,pb.z-az);
      if(dd<bd && pb.y<S.hubP.y){ bd=dd; best=p; bc=3; }
    }
  }
  if(!best || bc<2){ S.grab=null; return; }
  const b=best.body.position;
  const d=Math.hypot(b.x-ax,b.z-az);
  const centered=1-0.5*clamp(d/0.16,0,1);
  const below=clamp(0.5+(b.y-tipY)/0.07,0.35,1);
  const nF=enclosed?0.95:(bc>=3?1:0.82);
  const q=centered*below*nF*best.grip;
  const pSuccess=clamp(0.1+0.68*q,0.1,0.8);
  const fate = (guard || Math.random()<pSuccess) ? null :
    (Math.random()<(q<0.35?0.7:0.4) ? {stage:'lift',at:0.15+Math.random()*0.75} : {stage:'carry',at:0.1+Math.random()*0.75});
  // The claw holds the prize rigidly in whatever pose it was caught: the prize becomes kinematic and
  // rides along with the claw head. (cannon 0.6.2's LockConstraint assumes both bodies start aligned and
  // twists a tilted prize violently toward the claw's orientation, flinging it out.)
  const bq=best.body.quaternion;
  const rel=new THREE.Vector3(b.x,b.y,b.z).sub(S.hubP).applyQuaternion(_qi.copy(S.hubQ).invert());
  const relQ=_qi.clone().multiply(new THREE.Quaternion(bq.x,bq.y,bq.z,bq.w));   // hubQ⁻¹ · prizeQ
  best.body.type=CANNON.Body.KINEMATIC; best.body.allowSleep=false;
  best.body.velocity.set(0,0,0); best.body.angularVelocity.set(0,0,0);
  // while it's pulled out of the pile it slides past neighbours dragged up by the prongs; once clear
  // (see lift/carry) it pushes other prizes again
  best.body.collisionFilterMask=G_STATIC;
  best.body.wakeUp();
  const kin={body:best.body, pp:new THREE.Vector3(b.x,b.y,b.z), pq:new THREE.Quaternion(bq.x,bq.y,bq.z,bq.w)};
  // how far the held prize's furthest part reaches from its own centre
  let ext=0; best.body.shapes.forEach((sh,i)=>{ ext=Math.max(ext,best.body.shapeOffsets[i].length()+sh.radius); });
  S.grab={prize:best, kin, rel, relQ, fate, guard, ext:ext+0.005};
  S.hadGrab=true;
  tone(240,.1,'square',.035); tone(300,.12,'square',.03,.08);
}
function freeGrab(delay){
  const g=S.grab; if(!g) return;
  // hand the prize back to physics; it keeps the claw's current motion, so it simply falls
  g.prize.body.type=CANNON.Body.DYNAMIC; g.prize.body.allowSleep=true;
  g.prize.body.wakeUp();
  S.pendingMask.push({p:g.prize,t:delay});
  S.dropped=g.prize; S.dropT=3;
  S.grab=null;
}
function dropGrab(announce){
  freeGrab(0.4);
  S.loosen=0.25;
  if(announce && !S.msgShown){ S.msgShown=true; toast('滑掉了…',true); tone(420,.35,'triangle',.04,0,140); }
}
function releaseGrab(){ freeGrab(0.6); }
function overlapsOthers(p){
  const mine=spheresOf(p);
  for(const q of prizes){
    if(q===p) continue;
    const b=q.body.position; if(Math.abs(b.y-p.body.position.y)>0.6) continue;
    for(const s of spheresOf(q)) for(const m of mine)
      if(Math.hypot(s.x-m.x,s.y-m.y,s.z-m.z)<s.r+m.r) return true;
  }
  return false;
}
const CHUTE={x:-0.575, z:0.36};
function carryTarget(){
  const g=S.grab;
  if(!g) return HOME;
  const b=g.prize.body.position;
  return { x:clamp(CHUTE.x-(b.x-S.hubP.x),-BX,BX), z:clamp(CHUTE.z-(b.z-S.hubP.z),-BZ,BZ) };
}
function beginRelease(){ setPhase('release'); tone(700,.08,'square',.03); }
function endTurn(){
  if(!S.turnWin){
    const was=guaranteed();
    S.miss=Math.min(PITY,S.miss+1); save();
    if(!was && guaranteed()){
      showGuardBanner('下一次必中');
      fx.guardBurst=2.4; flashT=2.6;
      guardFanfare();
    } else if(S.miss===3 && !S.laserOn) showEasyNudge();   // the bubble replaces the miss toast so they don't overlap
    else if(!S.msgShown) toast(S.hadGrab?'差一點點！':'沒夾到，再試一次',true);
  }
  setPhase('ready');
  if(!prizes.length) setTimeout(showClear, achBusy?4200:1600);   // cleared the machine: settle the round
  else topUpMissing();
}
// keep every variant the player still needs in the machine, so no achievement can become impossible
function topUpMissing(){
  const room=24-prizes.length; if(room<=0) return;
  const present=new Set(prizes.map(p=>p.label)); let miss=0;
  TYPES.forEach(t=>t.colors.forEach(([,nm])=>{ const l=nm+t.kind; if(!S.counts[l] && !present.has(l)) miss++; }));
  if(!miss) return;
  spawnBatch(Math.min(miss,room),0.9);
  setTimeout(()=>{ if(S.phase==='ready' && !achBusy && $('clearPanel').hidden) toast('新款娃娃上架了',true); },700);
}
function showClear(){
  if(prizes.length || !$('clearPanel').hidden) return;
  const r=S.round, all=TYPES.reduce((a,t)=>a+t.colors.length,0);
  let have=0; TYPES.forEach(t=>t.colors.forEach(([,nm])=>{ if(S.counts[nm+t.kind]) have++; }));
  $('clearStats').innerHTML=`<div><b>${r.wins}</b><span>本輪抓到</span></div><div><b>${r.plays}</b><span>用了代幣</span></div><div><b>${r.fresh.length}</b><span>新款</span></div>`;
  $('clearNew').textContent=r.fresh.length?'新收集：'+r.fresh.join('、'):'';
  $('clearProg').textContent=`圖鑑 ${have} / ${all} 款 · 成就 ${S.ach.length} / ${ACHS.length}`;
  for(const k in keys) keys[k]=false;
  $('clearPanel').hidden=false; $('clearAgain').focus();
  burstConfetti(220); [523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'square',.04,i*.09));
}

function guaranteed(){ return S.miss>=PITY; }
let bannerTimer=0;
function showGuardBanner(sub){
  const b=$('guardBanner'); b.querySelector('.gb-text span').textContent=sub;
  b.hidden=true; void b.offsetWidth; b.hidden=false;
  clearTimeout(bannerTimer); bannerTimer=setTimeout(()=>{ b.hidden=true; },2800);
}
function guardFanfare(){
  [392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,'square',.035,i*.07));
  tone(1568,.5,'square',.035,.46); tone(1047,.5,'triangle',.03,.46); tone(784,.5,'triangle',.03,.46);
}

function postStep(h){
  const P=S.phase;
  if(P==='descend' && descendBlocked()) beginClose();
  else if(P==='close') closeContacts();
  for(let i=S.pendingMask.length-1;i>=0;i--){
    const m=S.pendingMask[i]; m.t-=h;
    if(m.t<=0){ m.p.body.collisionFilterMask=MASK_FULL; S.pendingMask.splice(i,1); }
  }
  S.dropT=Math.max(0,(S.dropT||0)-h);
  for(let i=prizes.length-1;i>=0;i--){
    const p=prizes[i], y=p.body.position.y;
    if(!isFinite(y) || y<-1.5){ if(S.grab&&S.grab.prize===p) freeGrab(0); removePrize(p); continue; }
    // chute funnel: the hole must never hold a prize. A long one (a bunny is ~45cm ear to foot) could lie
    // bridged between the barrier and the cabinet wall, or one just let go could catch the barrier's top
    // edge and tumble back out. Once it's over the hole it stops touching the walls and drops straight in.
    if(!(S.grab && S.grab.prize===p) && y<0.55){
      const b=p.body.position, v=p.body.velocity;
      const over=b.x<-0.37 && b.z>0.12;
      const edge=!over && p===S.dropped && S.dropT>0 && b.x<-0.28 && b.z>0.04;   // just released, landing on the rim
      if(over || edge){
        p.body.collisionFilterMask=G_CLAW; p.body.wakeUp();
        if(edge){ v.x=(CHUTE.x-b.x)*7; v.z=(CHUTE.z-b.z)*7; }   // steer it over the hole before it sinks below the floor
        else { v.x*=0.9; v.z*=0.9; }
      }
    }
    // safety net: if the claw ever crushes a prize into a wall, put it back inside and kill the outward speed
    if(y>-0.05 && !(S.grab && S.grab.prize===p)){
      const b=p.body.position, v=p.body.velocity, LX=0.7, LZ=0.5;
      if(b.x>LX){ b.x=LX; if(v.x>0) v.x=0; } else if(b.x<-LX){ b.x=-LX; if(v.x<0) v.x=0; }
      if(b.z>LZ){ b.z=LZ; if(v.z>0) v.z=0; } else if(b.z<-LZ){ b.z=-LZ; if(v.z<0) v.z=0; }
    }
    // won as soon as it has dropped below the floor inside the prize hole (or fallen deep anywhere)
    const pb=p.body.position, inHole=pb.x<-0.36 && pb.z>0.11 && y<-0.04;
    if(y<-0.3 || inHole){
      if(S.phase!=='ready' || S.pt<2.5) win(p);
      else { // settled into the chute with no play in progress: put it back on the pile
        p.body.position.set(0.25,0.9,0); p.body.velocity.set(0,0,0); p.body.angularVelocity.set(0,0,0); p.body.wakeUp();
        p.body.collisionFilterMask=MASK_FULL;
      }
    }
  }
}

function win(p){
  if(S.grab && S.grab.prize===p) freeGrab(0);
  removePrize(p);
  const wasGuard=guaranteed();
  // the 保夾 count only resets once the guaranteed grab is used; ordinary wins along the way keep it
  S.wins++; S.turnWin=true; S.msgShown=true; if(wasGuard) S.miss=0;
  burstConfetti(wasGuard?260:140);
  S.collection.push({label:p.label,color:p.color});
  if(!S.counts[p.label]) S.round.fresh.push(p.label);
  S.round.wins++;
  S.counts[p.label]=(S.counts[p.label]||0)+1;
  const got=newAchievements();
  save(); renderTray(true);
  toast('抓到了！'+p.label);
  flashT=2.2;
  [523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.04,i*.09));
  hideEasyNudge(true);
  if(got.length){ achQueue.push(...got); if(!achBusy) setTimeout(nextAchievement,1400); achBusy=true; }
}

const achQueue=[]; let achBusy=false;
function medalHTML(a){
  if(!a.type) return '<span class="star">★</span>';
  const [hex]=a.type.colors[0];
  return `<img alt="" src="${thumbnail(a.type,hex)}">`;
}
function nextAchievement(){
  const a=achQueue.shift();
  if(!a){ achBusy=false; return; }
  $('achMedal').innerHTML=medalHTML(a); $('achName').textContent=a.name; $('achDesc').textContent=a.desc;
  const b=$('achBanner'); b.hidden=true; void b.offsetWidth; b.hidden=false;
  burstConfetti(a.id==='all'?300:200); flashT=3;
  [659,784,1047,1319].forEach((f,i)=>tone(f,.18,'square',.035,i*.11));
  tone(1568,.6,'triangle',.035,.46); tone(1047,.6,'triangle',.03,.46);
  renderTray(true);
  setTimeout(()=>{ b.hidden=true; setTimeout(nextAchievement,250); },3400);
}

/* ----- fixed-step loop ----- */
function fixedStep(){

function pressGrab(){

    if(S.coins<=0){ S.coins=10; toast('補充了 10 枚代幣',true); tone(988,.08,'square',.035); updateButton(); return; }
    S.coins--; S.round.plays++; S.turnWin=false; S.hadGrab=false; S.msgShown=false;

/* ================= audio ================= */
let actx=null, soundOn=true;
function ensureAudio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
  if(actx && actx.state==='suspended') actx.resume().catch(()=>{});
}
function tone(f,d,type='square',v=.04,delay=0,f2){
  if(!soundOn||!actx) return;
  const t=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+0.03);
}

const stick=$('stick'), knob=$('knob'); let stickId=null;
function stickMove(e){
  const r=stick.getBoundingClientRect(), R=r.width*0.36;
  let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy); if(m>R){ dx*=R/m; dy*=R/m; }
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  const dead=0.12; let sx=dx/R, sy=-dy/R; if(Math.hypot(sx,sy)<dead){sx=0;sy=0;}
  stickV.x=sx; stickV.y=sy;
}
stick.addEventListener('pointerdown',e=>{ e.preventDefault(); ensureAudio(); stickId=e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
stick.addEventListener('pointermove',e=>{ if(e.pointerId===stickId) stickMove(e); });
function stickEnd(e){ if(e.pointerId!==stickId) return; stickId=null; stickV.x=stickV.y=0; knob.style.transform=''; }
stick.addEventListener('pointerup',stickEnd); stick.addEventListener('pointercancel',stickEnd);

// 3D thumbnails for the collection, rendered once per variant with a small second renderer
let thumbR=null, thumbScene=null, thumbCam=null; const thumbCache={};
function thumbnail(type,hex){
  const key=type.kind+hex; if(thumbCache[key]) return thumbCache[key];
  try{
    if(!thumbR){
      thumbR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
      thumbR.setPixelRatio(1); thumbR.setSize(192,192,false);
      thumbR.outputEncoding=THREE.sRGBEncoding; thumbR.toneMapping=THREE.ACESFilmicToneMapping; thumbR.toneMappingExposure=1.15;
      thumbScene=new THREE.Scene();
      thumbScene.add(new THREE.HemisphereLight(lin(0xfff1dd),lin(0x3a4380),0.9));
      const l=new THREE.DirectionalLight(lin(0xffffff),1.1); l.position.set(0.6,1,1.2); thumbScene.add(l);
      thumbCam=new THREE.PerspectiveCamera(30,1,0.01,10);
    }
    const spec=type.make(hex), g=spec.g;
    g.rotation.y=-0.35; thumbScene.add(g);
    const bb=new THREE.Box3().setFromObject(g), c=bb.getCenter(new THREE.Vector3()), sz=bb.getSize(new THREE.Vector3());
    const d=Math.max(sz.x,sz.y)*0.62/Math.tan(THREE.MathUtils.degToRad(15));
    thumbCam.position.set(c.x,c.y+d*0.12,c.z+d); thumbCam.lookAt(c);
    thumbR.render(thumbScene,thumbCam);
    thumbCache[key]=thumbR.domElement.toDataURL('image/png');
    thumbScene.remove(g);
  }catch(e){ thumbCache[key]=''; }
  return thumbCache[key];
}

/* ----- big 3D viewer for a collected prize ----- */
const V={open:false,r:null,scene:null,cam:null,pivot:null,model:null,yaw:-0.5,pitch:0.22,vel:0,zoom:1,dist:0.8,h:0.3,spin:true,drag:null,pts:new Map(),pinch:0,last:0};
const reduceMotion=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function initViewer(){
  const cv=$('viewCanvas');
  V.r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  V.r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  V.r.outputEncoding=THREE.sRGBEncoding; V.r.toneMapping=THREE.ACESFilmicToneMapping; V.r.toneMappingExposure=1.15;
  V.r.shadowMap.enabled=true; V.r.shadowMap.type=THREE.PCFSoftShadowMap;
  V.scene=new THREE.Scene();
  V.scene.add(new THREE.HemisphereLight(lin(0xfff1dd),lin(0x3a4380),0.85));
  const key=new THREE.DirectionalLight(lin(0xfff6ea),1.2); key.position.set(0.6,1.4,1); key.castShadow=true;
  key.shadow.mapSize.set(1024,1024); Object.assign(key.shadow.camera,{left:-.4,right:.4,top:.4,bottom:-.4,near:.1,far:4}); key.shadow.bias=-0.0005;
  V.scene.add(key);
  const rim=new THREE.DirectionalLight(lin(0x9fd8ff),0.6); rim.position.set(-1,0.8,-1.2); V.scene.add(rim);
  const tt=new THREE.Mesh(new THREE.CylinderGeometry(.24,.26,.03,48),MAT.cream); tt.position.y=-.015; tt.receiveShadow=true; V.scene.add(tt);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.25,.008,8,64),MAT.tangerine); ring.rotation.x=Math.PI/2; ring.position.y=-.002; V.scene.add(ring);
  V.pivot=new THREE.Group(); V.scene.add(V.pivot);
  V.cam=new THREE.PerspectiveCamera(30,1,.01,20);

  // drag to rotate (one finger / mouse), pinch or wheel to zoom
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId); V.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(V.pts.size===1){ V.drag={x:e.clientX,y:e.clientY,t:performance.now()}; V.vel=0; }
    else { V.drag=null; const [a,b]=[...V.pts.values()]; V.pinch=Math.hypot(a.x-b.x,a.y-b.y); }
  });
  cv.addEventListener('pointermove',e=>{
    if(!V.pts.has(e.pointerId)) return;
    V.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(V.pts.size>=2){
      const [a,b]=[...V.pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(V.pinch>0) V.zoom=clamp(V.zoom*V.pinch/d,0.55,1.8);
      V.pinch=d; return;
    }
    if(!V.drag) return;
    const now=performance.now(), dx=e.clientX-V.drag.x, dy=e.clientY-V.drag.y, dt=Math.max(1,now-V.drag.t)/1000;
    V.yaw+=dx*0.012; V.pitch=clamp(V.pitch+dy*0.006,-0.25,1.1);
    V.vel=clamp(dx*0.012/dt,-12,12);
    V.drag={x:e.clientX,y:e.clientY,t:now};
  });
  const up=e=>{ V.pts.delete(e.pointerId); if(V.pts.size<2) V.pinch=0; if(V.pts.size===0) V.drag=null; };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); V.zoom=clamp(V.zoom*(e.deltaY>0?1.1:0.9),0.55,1.8); },{passive:false});
}
function openViewer(type,hex,label,n){
  if(!V.r) initViewer();
  if(V.model) V.pivot.remove(V.model);
  const spec=type.make(hex), holder=new THREE.Group();
  holder.add(spec.g);
  const bb=new THREE.Box3().setFromObject(holder), c=bb.getCenter(new THREE.Vector3()), s=bb.getSize(new THREE.Vector3());
  spec.g.position.set(-c.x,-bb.min.y,-c.z);   // centred, standing on the turntable
  V.pivot.add(holder); V.model=holder;
  V.h=s.y; V.dist=(Math.max(s.x,s.y,s.z)*0.5+0.13)/Math.tan(THREE.MathUtils.degToRad(15));
  V.yaw=-0.5; V.pitch=0.22; V.zoom=1; V.vel=0;
  $('viewerTitle').textContent=label;
  $('viewerMeta').textContent=`${type.kind}系列 · 收集 ×${n}`;
  V.spin=!reduceMotion; $('viewerSpin').setAttribute('aria-pressed',String(V.spin));
  $('viewerPanel').hidden=false; V.open=true;
  const cv=$('viewCanvas'), w=Math.max(200,cv.clientWidth); V.r.setSize(w,w,false);
  V.cam.aspect=1; V.cam.updateProjectionMatrix();
  $('viewerClose').focus();
  V.last=performance.now(); requestAnimationFrame(viewerLoop);
}
function closeViewer(){ V.open=false; $('viewerPanel').hidden=true; V.pts.clear(); V.drag=null; }
function viewerLoop(t){
  if(!V.open) return;
  const dt=Math.min(0.05,(t-V.last)/1000); V.last=t;
  if(!V.drag){
    const target=V.spin?0.7:0;                  // flick inertia settles into a slow turntable spin
    V.vel+=(target-V.vel)*Math.min(1,dt*2.2);
    V.yaw+=V.vel*dt;
  }
  V.pivot.rotation.y=V.yaw;
  const d=V.dist*V.zoom, ty=V.h*0.48;
  V.cam.position.set(0,ty+Math.sin(V.pitch)*d,Math.cos(V.pitch)*d);
  V.cam.lookAt(0,ty,0);
  V.r.render(V.scene,V.cam);
  requestAnimationFrame(viewerLoop);
}
$('viewerClose').addEventListener('click',closeViewer);
$('viewerPanel').addEventListener('pointerdown',e=>{ if(e.target===e.currentTarget) closeViewer(); });
$('viewerSpin').addEventListener('click',e=>{ V.spin=!V.spin; e.currentTarget.setAttribute('aria-pressed',String(V.spin)); });
$('viewerReset').addEventListener('click',()=>{ V.yaw=-0.5; V.pitch=0.22; V.zoom=1; V.vel=0; });

/* ================= render loop ================= */
function resize(){
  const w=canvas.clientWidth||window.innerWidth, h=canvas.clientHeight||window.innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

function updateCamera(){
  cam.az+=(cam.targetAz-cam.az)*0.12;
  const aspect=camera.aspect, t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const portrait=aspect<0.8;
  const dist=Math.max(1.9/t, 1.25/(t*aspect));
  camTarget.set(0, portrait?0.62:0.82, 0);
  camera.position.set(camTarget.x+Math.sin(cam.az)*Math.cos(cam.el)*dist, camTarget.y+Math.sin(cam.el)*dist, camTarget.z+Math.cos(cam.az)*Math.cos(cam.el)*dist);
  camera.lookAt(camTarget);
}

let flashT=0, clock=0;
function syncVisuals(dt){
  clock+=dt;
  for(const p of prizes){ p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion); }
  hubMesh.position.copy(S.hubP); hubMesh.quaternion.copy(S.hubQ);
  prongMeshes.forEach((m,i)=>{ m.position.copy(S.pP[i]); m.quaternion.copy(S.pQ[i]); });
  // cable from carriage to hub top
  const top=_v.set(0,0.05,0).applyQuaternion(S.hubQ).add(S.hubP);
  const car=_v2.set(S.gx,GANTRY_Y,S.gz);
  const len=car.distanceTo(top);
  cable.position.copy(car).add(top).multiplyScalar(0.5);
  cable.quaternion.setFromUnitVectors(YAX,_dir.copy(car).sub(top).normalize());
  cable.scale.y=len;
  bridge.position.set(S.gx,GANTRY_Y+0.05,0);
  carriage.position.set(S.gx,GANTRY_Y,S.gz);
  // aiming laser straight down from the claw
  const aim=S.laserOn && (S.phase==='move'||S.phase==='ready');
  laser.visible=marker.visible=aim;
  if(aim){
    let sy=0;
    for(const p of prizes) for(const s of spheresOf(p)){ const d=Math.hypot(s.x-S.hubP.x,s.z-S.hubP.z); if(d<s.r) sy=Math.max(sy,s.y+Math.sqrt(s.r*s.r-d*d)); }
    const y0=S.hubP.y-0.05, l=Math.max(0.01,y0-sy);
    laser.position.set(S.hubP.x,sy+l/2,S.hubP.z); laser.scale.y=l;
    marker.position.set(S.hubP.x,sy+0.004,S.hubP.z);
    marker.scale.setScalar(1+0.18*Math.sin(clock*6));
    laserGlowMat.opacity=0.28+0.18*Math.sin(clock*6);
  }
  // coin insert: arcs toward the slot while flipping, turns edge-on, slides in
  const ct=S.phase==='coin'?S.pt:99;
  coin.visible=ct<COIN_T;
  if(coin.visible){
    if(ct<COIN_HIT){
      const u=ct/COIN_HIT, e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      // start near the viewer's hand, arc down into the slot
      const sx=camera.position.x*0.45+0.15, sy=0.5, sz=camera.position.z*0.55;
      coin.position.set(sx+(SLOT.x-sx)*e, sy+(SLOT.y-sy)*e+Math.sin(Math.PI*e)*0.3, sz+(SLOT.z-sz)*e);
      coin.rotation.set(0,(1-e)*6*Math.PI+0.001,Math.PI/2);
    } else {
      const u=(ct-COIN_HIT)/(COIN_T-COIN_HIT);
      coin.position.set(SLOT.x,SLOT.y,SLOT.z-u*0.14);
      coin.rotation.set(0,0,Math.PI/2);
    }
  }
  MAT.coinLight.emissiveIntensity=(S.phase==='coin'&&ct>=COIN_HIT)?(Math.floor(clock*12)%2?1.4:0.5):0;
  // marquee bulbs
  flashT=Math.max(0,flashT-dt);
  updateEffects(dt);
  const g=guaranteed(), rate=flashT>0?10:1.6, on=Math.floor(clock*rate)%2;
  for(const b of bulbs){
    if(g){ // rainbow chase running around the marquee
      const k=b.j?b.i:16-b.i+17, h=((k*0.045-clock*0.9)%1+1)%1;
      b.m.emissive.setHSL(h,1,0.55); b.m.emissiveIntensity=flashT>0&&on?2.2:1.5;
    } else {
      b.m.emissive.copy(BULB_WARM); b.m.emissiveIntensity=(((b.i+b.j)%2===0)===!!on)?1.1:0.12;
    }
  }
  sign.material.map=(g && (clock%1.6)<1.2)?signGuardTex:signTex;
}

let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; acc+=dt;
  let n=0; while(acc>=H && n<8){ fixedStep(); acc-=H; n++; }
  if(n>=8) acc=0;
  syncVisuals(dt); updateCamera(); updateHUD();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
resize();
computePoses(); snapKin();
spawnBatch(FULL,0,true);   // a full machine with every variant in it, so nothing ever needs restocking
for(let i=0;i<720;i++){ driveAll(); world.step(H); }
S.pt=99; // not inside a turn's grace window
renderTray(); updateButton(); updateHUD();
$('boot').hidden=true;
requestAnimationFrame(t=>{ last=t; frame(t); });
})();
</script>
